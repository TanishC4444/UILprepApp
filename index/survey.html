<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UIL Prep — Event Assessment</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<style>
/* ── Reset for this page ────────────────────────────────────────────── */
html, body { height: 100%; overflow: hidden; background: #f4f5f9; }

/* ── Shell ──────────────────────────────────────────────────────────── */
.assess-shell {
  display: grid;
  grid-template-columns: 240px 1fr;
  height: 100vh;
  width: 100vw;
}

/* ── Sidebar ────────────────────────────────────────────────────────── */
.assess-sidebar {
  background: var(--ink);
  display: flex;
  flex-direction: column;
  padding: 2rem 1.5rem 1.5rem;
  overflow: hidden;
  position: relative;
}

/* Subtle grid texture */
.assess-sidebar::before {
  content: '';
  position: absolute;
  inset: 0;
  background-image:
    linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
  background-size: 24px 24px;
  pointer-events: none;
}

.sb-back {
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  color: rgba(255,255,255,0.45);
  text-decoration: none;
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 4px;
  padding: 0.35rem 0.8rem;
  align-self: flex-start;
  transition: color 0.2s, border-color 0.2s, background 0.2s;
  position: relative;
  z-index: 1;
  margin-bottom: 2.5rem;
}
.sb-back:hover { color: #fff; border-color: rgba(255,255,255,0.4); background: rgba(255,255,255,0.06); }

.sb-eyebrow {
  font-family: var(--font-mono);
  font-size: 0.58rem;
  font-weight: 700;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--red);
  position: relative; z-index: 1;
  margin-bottom: 0.4rem;
}

.sb-title {
  font-family: 'Sora', sans-serif;
  font-size: 1.15rem;
  font-weight: 800;
  color: #fff;
  line-height: 1.2;
  position: relative; z-index: 1;
  margin-bottom: 2rem;
}

/* Step list */
.sb-steps {
  display: flex;
  flex-direction: column;
  gap: 0;
  flex: 1;
  position: relative; z-index: 1;
}

.sb-step {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding: 0.5rem 0;
  position: relative;
}

.sb-step + .sb-step::before {
  content: '';
  position: absolute;
  left: 9px; top: -4px;
  width: 1px; height: 8px;
  background: rgba(255,255,255,0.1);
}

.sb-dot {
  width: 19px; height: 19px;
  border-radius: 50%;
  border: 1.5px solid rgba(255,255,255,0.15);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
  margin-top: 1px;
  transition: all 0.25s ease;
}

.sb-dot-num {
  font-size: 0.55rem;
  font-weight: 700;
  color: rgba(255,255,255,0.3);
}

.sb-step.s-done .sb-dot  { background: rgba(255,255,255,0.15); border-color: transparent; }
.sb-step.s-done .sb-dot-num { color: rgba(255,255,255,0.7); }
.sb-step.s-done .sb-dot::after { content: '✓'; font-size: 0.55rem; color: rgba(255,255,255,0.7); }
.sb-step.s-done .sb-dot-num { display: none; }

.sb-step.s-active .sb-dot { background: var(--red); border-color: var(--red); }
.sb-step.s-active .sb-dot-num { color: #fff; }

.sb-step-label {
  font-size: 0.74rem;
  font-weight: 500;
  color: rgba(255,255,255,0.28);
  padding-top: 1px;
  line-height: 1.3;
  transition: color 0.25s ease;
}
.sb-step.s-active .sb-step-label { color: rgba(255,255,255,0.9); font-weight: 600; }
.sb-step.s-done  .sb-step-label  { color: rgba(255,255,255,0.45); }

.sb-footer {
  position: relative; z-index: 1;
  padding-top: 1.5rem;
  border-top: 1px solid rgba(255,255,255,0.07);
  font-size: 0.64rem;
  color: rgba(255,255,255,0.25);
  line-height: 1.6;
}

/* ── Main panel ─────────────────────────────────────────────────────── */
.assess-main {
  display: flex;
  flex-direction: column;
  overflow: hidden;
  background: #f4f5f9;
}

/* Progress strip */
.assess-progress {
  height: 3px;
  background: rgba(20,22,28,0.08);
  flex-shrink: 0;
}
.assess-progress-fill {
  height: 100%;
  background: linear-gradient(90deg, var(--blue) 0%, var(--red) 100%);
  transition: width 0.55s cubic-bezier(0.16,1,0.3,1);
  width: 0%;
}

/* Top bar */
.assess-topbar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 1.1rem 2.5rem 0;
  flex-shrink: 0;
}

.assess-step-label {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--ink-dim);
}

.assess-step-count {
  font-family: var(--font-mono);
  font-size: 0.7rem;
  font-weight: 600;
  color: var(--ink-dim);
}

/* Content area */
.assess-content {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
  padding: 1.5rem 2.5rem 0.5rem;
  overflow-y: auto;
}

/* Question block */
.q-block {
  display: none;
  flex-direction: column;
  gap: 1.2rem;
}
.q-block.q-active {
  display: flex;
  animation: riseIn 0.4s cubic-bezier(0.16,1,0.3,1) both;
}

.q-heading {
  display: flex;
  flex-direction: column;
  gap: 0.35rem;
}

.q-label {
  font-family: var(--font-mono);
  font-size: 0.62rem;
  font-weight: 700;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--blue);
}

.q-text {
  font-family: 'Sora', sans-serif;
  font-size: clamp(1.05rem, 1.7vw, 1.4rem);
  font-weight: 700;
  color: var(--ink);
  line-height: 1.25;
  max-width: 540px;
}

.q-hint {
  font-size: 0.78rem;
  color: var(--ink-dim);
  max-width: 440px;
  margin-top: -0.2rem;
}

/* Grade row */
.grade-row {
  display: flex;
  flex-wrap: wrap;
  gap: 0.4rem;
  max-width: 500px;
}

.grade-pill {
  font-family: 'Inter', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 0.4rem 0.9rem;
  border-radius: 5px;
  border: 1.5px solid rgba(20,22,28,0.12);
  background: #fff;
  color: var(--ink);
  cursor: pointer;
  transition: all 0.18s ease;
  user-select: none;
}
.grade-pill:hover { border-color: var(--blue); color: var(--blue); }
.grade-pill.g-selected { background: var(--blue); border-color: var(--blue); color: #fff; }

/* Option grid */
.opt-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
  gap: 0.45rem;
  max-width: 620px;
}

.opt-item {
  background: #fff;
  border: 1.5px solid rgba(20,22,28,0.1);
  border-radius: 7px;
  padding: 0.7rem 0.9rem;
  cursor: pointer;
  transition: all 0.18s ease;
  display: flex;
  flex-direction: column;
  gap: 0.2rem;
  user-select: none;
  position: relative;
}
.opt-item:hover { border-color: rgba(56,79,150,0.4); box-shadow: 0 3px 12px rgba(56,79,150,0.08); transform: translateY(-1px); }

.opt-item.o-selected {
  background: var(--blue-tint);
  border-color: var(--blue);
}

.opt-item.o-selected::after {
  content: '✓';
  position: absolute;
  top: 0.45rem; right: 0.6rem;
  font-size: 0.6rem;
  font-weight: 800;
  color: var(--blue);
}

.opt-label {
  font-size: 0.82rem;
  font-weight: 600;
  color: var(--ink);
  line-height: 1.3;
}
.opt-item.o-selected .opt-label { color: var(--blue); }

.opt-sub {
  font-size: 0.68rem;
  color: var(--ink-dim);
  line-height: 1.3;
  font-weight: 400;
}

/* Multi-select hint */
.multi-hint {
  font-family: var(--font-mono);
  font-size: 0.66rem;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--ink-dim);
  margin-top: -0.4rem;
}

/* ── Nav ────────────────────────────────────────────────────────────── */
.assess-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0.8rem 2.5rem 1.5rem;
  flex-shrink: 0;
}

.nav-back {
  font-family: 'Inter', sans-serif;
  font-size: 0.76rem;
  font-weight: 600;
  color: var(--ink-dim);
  background: none;
  border: none;
  cursor: pointer;
  padding: 0.45rem 0;
  transition: color 0.18s;
}
.nav-back:hover { color: var(--ink); }
.nav-back:disabled { opacity: 0; pointer-events: none; }

.nav-next {
  font-family: 'Inter', sans-serif;
  font-size: 0.78rem;
  font-weight: 700;
  background: var(--blue);
  color: #fff;
  border: none;
  border-radius: 6px;
  padding: 0.6rem 1.5rem;
  cursor: pointer;
  letter-spacing: 0.02em;
  transition: all 0.2s ease;
}
.nav-next:hover { filter: brightness(1.08); transform: translateY(-1px); box-shadow: 0 6px 18px rgba(56,79,150,0.28); }
.nav-next:disabled { opacity: 0.35; pointer-events: none; transform: none; box-shadow: none; }

/* ── Results ────────────────────────────────────────────────────────── */
.results-block {
  display: none;
  flex-direction: column;
  gap: 1rem;
  max-width: 600px;
}
.results-block.r-active {
  display: flex;
  animation: riseIn 0.45s cubic-bezier(0.16,1,0.3,1) both;
}

.results-head { display: flex; flex-direction: column; gap: 0.3rem; }

.results-title {
  font-family: 'Sora', sans-serif;
  font-size: clamp(1.1rem, 2vw, 1.45rem);
  font-weight: 800;
  color: var(--ink);
}

.results-sub {
  font-size: 0.76rem;
  color: var(--ink-dim);
}

/* Event result rows */
.r-list { display: flex; flex-direction: column; gap: 0.4rem; }

.r-row {
  background: #fff;
  border: 1.5px solid rgba(20,22,28,0.08);
  border-radius: 7px;
  padding: 0.7rem 1rem;
  display: grid;
  grid-template-columns: 28px 1fr 72px;
  align-items: center;
  gap: 0.8rem;
  opacity: 0;
  animation: riseIn 0.35s ease forwards;
}
.r-row:nth-child(1) { animation-delay: 0.06s; border-left: 3px solid var(--blue); }
.r-row:nth-child(2) { animation-delay: 0.12s; border-left: 3px solid var(--blue); }
.r-row:nth-child(3) { animation-delay: 0.18s; border-left: 3px solid color-mix(in srgb, var(--blue) 50%, var(--red)); }
.r-row:nth-child(4) { animation-delay: 0.24s; border-left: 3px solid var(--red); }
.r-row:nth-child(5) { animation-delay: 0.30s; border-left: 3px solid rgba(20,22,28,0.15); }

.r-rank {
  font-family: 'Sora', sans-serif;
  font-size: 1rem;
  font-weight: 800;
  color: rgba(20,22,28,0.2);
  text-align: center;
}
.r-row:nth-child(1) .r-rank { color: var(--blue); }
.r-row:nth-child(2) .r-rank { color: var(--blue); opacity: 0.7; }
.r-row:nth-child(3) .r-rank { color: var(--red); opacity: 0.8; }

.r-info { display: flex; flex-direction: column; gap: 0.15rem; }
.r-name { font-size: 0.85rem; font-weight: 700; color: var(--ink); }
.r-why  { font-size: 0.68rem; color: var(--ink-dim); line-height: 1.3; }

.r-bar-wrap { display: flex; flex-direction: column; gap: 3px; align-items: flex-end; }
.r-bar-bg { width: 72px; height: 4px; background: rgba(20,22,28,0.08); border-radius: 999px; overflow: hidden; }
.r-bar-fill { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--blue), var(--red)); }
.r-score { font-family: var(--font-mono); font-size: 0.6rem; font-weight: 700; color: var(--ink-dim); letter-spacing: 0.04em; }

.btn-retake {
  font-family: 'Inter', sans-serif;
  font-size: 0.72rem;
  font-weight: 600;
  color: var(--ink-dim);
  border: 1.5px solid rgba(20,22,28,0.12);
  background: #fff;
  border-radius: 5px;
  padding: 0.45rem 1rem;
  cursor: pointer;
  align-self: flex-start;
  transition: all 0.18s ease;
  margin-top: 0.3rem;
}
.btn-retake:hover { border-color: var(--ink); color: var(--ink); }

/* ── Responsive ─────────────────────────────────────────────────────── */
@media (max-width: 700px) {
  html, body { overflow: auto; }
  .assess-shell { grid-template-columns: 1fr; height: auto; }
  .assess-sidebar { padding: 1.2rem 1.2rem 1rem; }
  .sb-steps { display: none; }
  .sb-footer { display: none; }
  .assess-content { padding: 1.2rem 1.2rem 0.5rem; }
  .assess-nav { padding: 0.8rem 1.2rem 1.2rem; }
  .q-text { font-size: 5.5vw; }
  .opt-grid { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<div class="assess-shell">

  <!-- SIDEBAR -->
  <aside class="assess-sidebar">
    <a href="info.html" class="sb-back">&#8592; Back</a>
    <p class="sb-eyebrow">UIL Prep</p>
    <h2 class="sb-title">Event Assessment</h2>
    <div class="sb-steps" id="sbSteps"></div>
    <p class="sb-footer">Results are a starting point, not a verdict. Talk to your coach about what fits your grade and school's needs.</p>
  </aside>

  <!-- MAIN -->
  <main class="assess-main">
    <div class="assess-progress"><div class="assess-progress-fill" id="progressFill"></div></div>

    <div class="assess-topbar">
      <span class="assess-step-label" id="topStepLabel">&nbsp;</span>
      <span class="assess-step-count" id="topStepCount">&nbsp;</span>
    </div>

    <div class="assess-content" id="assessContent"></div>

    <nav class="assess-nav">
      <button class="nav-back" id="btnBack" onclick="go(-1)">&#8592; Back</button>
      <button class="nav-next" id="btnNext" onclick="go(1)">Continue</button>
    </nav>
  </main>

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.2/anime.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script>
// ═══════════════════════════════════════════════════════════════════════════
// DATA
// ═══════════════════════════════════════════════════════════════════════════

const EVENTS = [
  { id:'calc',     name:'Calculator Applications', grades:[6,7,8],
    tags:['math','speed','numbers','precision'],
    desc:'Solve applied math problems using a calculator against the clock.' },
  { id:'chess',    name:'Chess Puzzles',           grades:[2,3,4,5,6,7,8],
    tags:['strategy','logic','patterns','focus'],
    desc:'Identify the strongest move in a series of chess positions.' },
  { id:'imprompt', name:'Impromptu Speaking',      grades:[6,7,8],
    tags:['speaking','confidence','creativity','thinking'],
    desc:'Deliver a structured speech on an unseen topic with minimal preparation.' },
  { id:'math',     name:'Mathematics',             grades:[6,7,8],
    tags:['math','algebra','reasoning','challenge'],
    desc:'Solve advanced problems in algebra, geometry, and number theory — no calculator.' },
  { id:'oratory',  name:'Modern Oratory',          grades:[6,7,8],
    tags:['speaking','writing','persuasion','research'],
    desc:'Write and memorize a persuasive speech on a current public issue.' },
  { id:'numsense', name:'Number Sense',            grades:[2,3,4,5,6,7,8],
    tags:['math','mental','speed','numbers'],
    desc:'Mental arithmetic — no calculator, no scratch work, pure speed and accuracy.' },
  { id:'oral',     name:'Oral Reading',            grades:[4,5,6,7,8,9],
    tags:['reading','speaking','expression','literature'],
    desc:'Read a literary passage aloud with clarity, pacing, and interpretation.' },
  { id:'science',  name:'Science',                 grades:[6,7,8],
    tags:['science','research','reasoning','facts'],
    desc:'Answer questions spanning biology, chemistry, physics, and earth science.' },
  { id:'social',   name:'Social Studies',          grades:[5,6,7,8],
    tags:['history','geography','facts','reading'],
    desc:'Demonstrate knowledge of history, government, economics, and geography.' },
  { id:'spelling', name:'Spelling & Vocabulary',   grades:[3,4,5,6,7,8],
    tags:['words','language','memory','reading'],
    desc:'Spell words correctly and demonstrate command of definitions and etymology.' },
];

const QS = [
  {
    id:'grade', sidebar:'Your grade',
    label:'About you', text:'What grade are you currently in?',
    type:'grade',
  },
  {
    id:'domain', sidebar:'Academic domain',
    label:'Question 1 of 6',
    text:'Which academic domain do you feel strongest in?',
    type:'single',
    opts:[
      { v:'math',    l:'Mathematics & numbers',     sub:'Arithmetic, algebra, computation' },
      { v:'words',   l:'Language & writing',        sub:'Reading, vocabulary, composition' },
      { v:'science', l:'Science & how things work', sub:'Biology, chemistry, physics, earth science' },
      { v:'speaking',l:'Communication & rhetoric',  sub:'Speaking, persuasion, storytelling' },
      { v:'history', l:'History & social studies',  sub:'Events, geography, government, economics' },
      { v:'strategy',l:'Logic & strategic thinking',sub:'Puzzles, patterns, planning ahead' },
    ],
  },
  {
    id:'pace', sidebar:'Working pace',
    label:'Question 2 of 6',
    text:'How do you naturally work through a difficult problem?',
    type:'single',
    opts:[
      { v:'fast',    l:'Quickly and instinctively',  sub:'Rely on pattern recognition and speed' },
      { v:'steady',  l:'Methodically and precisely', sub:'Work through each step carefully' },
      { v:'creative',l:'Creatively and flexibly',    sub:'Try angles, reframe, find novel approaches' },
    ],
  },
  {
    id:'audience', sidebar:'Stage comfort',
    label:'Question 3 of 6',
    text:'How comfortable are you performing or speaking in front of an audience?',
    type:'single',
    opts:[
      { v:'yes',     l:'Very comfortable',           sub:'The audience adds energy, not pressure' },
      { v:'neutral', l:'Somewhat comfortable',       sub:'I can do it, though I prefer not to rely on it' },
      { v:'no',      l:'Not my preference',          sub:'I perform better working alone or in writing' },
    ],
  },
  {
    id:'prep', sidebar:'Preparation style',
    label:'Question 4 of 6',
    text:'When preparing for a high-stakes assessment, what works best for you?',
    type:'single',
    opts:[
      { v:'memorize',l:'Systematic memorization',   sub:'Flashcards, repetition, comprehensive review' },
      { v:'drill',   l:'Timed drills and practice', sub:'Speed rounds, test simulations, reps under pressure' },
      { v:'write',   l:'Research and rehearsal',    sub:'Deep reading, drafting, refining, presenting' },
      { v:'think',   l:'Problem sets and reasoning',sub:'Working novel problems, building mental models' },
    ],
  },
  {
    id:'enjoy', sidebar:'Strongest subjects',
    label:'Question 5 of 6',
    text:'Which school subjects do you genuinely enjoy? Select all that apply.',
    type:'multi',
    opts:[
      { v:'math',    l:'Mathematics' },
      { v:'english', l:'English / Language Arts' },
      { v:'science', l:'Science' },
      { v:'ss',      l:'Social Studies' },
      { v:'speech',  l:'Speech, Theatre, or Debate' },
      { v:'cs',      l:'Computer Science / Technology' },
    ],
  },
  {
    id:'compete', sidebar:'Competition format',
    label:'Question 6 of 6',
    text:'Which competition format suits you most?',
    type:'single',
    opts:[
      { v:'test',   l:'Written test, solo, quiet room',     sub:'Pure knowledge assessed on paper' },
      { v:'stage',  l:'Live delivery in front of judges',   sub:'Performance and presence evaluated in real time' },
      { v:'timed',  l:'Race against the clock',             sub:'Speed and accuracy under strict time pressure' },
      { v:'puzzle', l:'Strategic or analytical challenge',  sub:'Reasoning and pattern recognition' },
    ],
  },
];

// ═══════════════════════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════════════════════

const ans = {};
let cur = 0;
let onResults = false;

// ═══════════════════════════════════════════════════════════════════════════
// BUILD
// ═══════════════════════════════════════════════════════════════════════════

function buildSidebar() {
  document.getElementById('sbSteps').innerHTML = QS.map((q,i) =>
    `<div class="sb-step" id="sbStep${i}">
      <div class="sb-dot"><span class="sb-dot-num">${i+1}</span></div>
      <span class="sb-step-label">${q.sidebar}</span>
    </div>`
  ).join('');
}

function buildContent() {
  const el = document.getElementById('assessContent');

  el.innerHTML = QS.map((q, i) => {
    let body = '';

    if (q.type === 'grade') {
      const grades = [2,3,4,5,6,7,8,9];
      const suffix = g => g===2?'nd':g===3?'rd':g===9?'th':'th';
      body = `<div class="grade-row">${grades.map(g =>
        `<button class="grade-pill" data-g="${g}" onclick="pickGrade(${g},this)">${g}${suffix(g)} grade</button>`
      ).join('')}</div>`;
    }

    else if (q.type === 'single') {
      body = `<div class="opt-grid">${q.opts.map(o =>
        `<div class="opt-item" data-q="${q.id}" data-v="${o.v}" onclick="pickSingle(this,'${q.id}','${o.v}')">
          <span class="opt-label">${o.l}</span>
          ${o.sub ? `<span class="opt-sub">${o.sub}</span>` : ''}
        </div>`
      ).join('')}</div>`;
    }

    else if (q.type === 'multi') {
      body = `<p class="multi-hint">Select all that apply</p>
      <div class="opt-grid">${q.opts.map(o =>
        `<div class="opt-item" data-q="${q.id}" data-v="${o.v}" onclick="toggleMulti(this,'${q.id}','${o.v}')">
          <span class="opt-label">${o.l}</span>
        </div>`
      ).join('')}</div>`;
    }

    return `<div class="q-block${i===0?' q-active':''}" id="qb${i}">
      <div class="q-heading">
        <span class="q-label">${q.label}</span>
        <h2 class="q-text">${q.text}</h2>
        ${q.hint ? `<p class="q-hint">${q.hint}</p>` : ''}
      </div>
      ${body}
    </div>`;
  }).join('')
  + `<div class="results-block" id="resultsBlock">
      <div class="results-head">
        <span class="q-label">Your Results</span>
        <h2 class="results-title">Recommended events</h2>
        <p class="results-sub">Ranked by match strength based on your responses. All results are for the eligible events in your grade.</p>
      </div>
      <div class="r-list" id="rList"></div>
      <button class="btn-retake" onclick="retake()">&#8635;&ensp;Retake assessment</button>
    </div>`;
}

// ═══════════════════════════════════════════════════════════════════════════
// INTERACTION
// ═══════════════════════════════════════════════════════════════════════════

// Tactile pop feedback on selection — a small, consistent tell that an
// answer has been "bubbled in", using anime.js if it loaded.
function popIt(el) {
  if (window.anime) {
    anime({ targets: el, scale: [0.96, 1], duration: 260, easing: 'easeOutBack' });
  }
}

function pickGrade(g, btn) {
  document.querySelectorAll('.grade-pill').forEach(b => b.classList.remove('g-selected'));
  btn.classList.add('g-selected');
  popIt(btn);
  ans.grade = g;
  refreshNav();
}

function pickSingle(el, qId, val) {
  document.querySelectorAll(`[data-q="${qId}"]`).forEach(c => c.classList.remove('o-selected'));
  el.classList.add('o-selected');
  popIt(el);
  ans[qId] = val;
  refreshNav();
  // Auto-advance on single-select after brief pause
  setTimeout(() => { if (!onResults && cur < QS.length-1) go(1); }, 280);
}

function toggleMulti(el, qId, val) {
  if (!ans[qId]) ans[qId] = [];
  if (el.classList.contains('o-selected')) {
    el.classList.remove('o-selected');
    ans[qId] = ans[qId].filter(v => v !== val);
  } else {
    el.classList.add('o-selected');
    popIt(el);
    ans[qId].push(val);
  }
  refreshNav();
}

// ═══════════════════════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════════════════════

function go(dir) {
  if (onResults && dir === -1) {
    document.getElementById('resultsBlock').classList.remove('r-active');
    onResults = false;
    showQ(cur);
    refreshNav();
    return;
  }
  if (dir === 1 && cur === QS.length - 1) {
    showResults();
    return;
  }
  const next = cur + dir;
  if (next < 0 || next >= QS.length) return;
  document.getElementById(`qb${cur}`).classList.remove('q-active');
  cur = next;
  showQ(cur);
  refreshNav();
}

function showQ(i) {
  document.getElementById(`qb${i}`).classList.add('q-active');
  QS.forEach((_, idx) => {
    const el = document.getElementById(`sbStep${idx}`);
    el.classList.remove('s-active','s-done');
    if (idx < i) el.classList.add('s-done');
    else if (idx === i) el.classList.add('s-active');
  });
}

function refreshNav() {
  const pct = onResults ? 100 : (cur / QS.length * 100);
  document.getElementById('progressFill').style.width = pct + '%';

  const q = QS[cur];
  document.getElementById('topStepLabel').textContent = onResults ? 'Complete' : q.sidebar;
  document.getElementById('topStepCount').textContent = onResults ? '' : `${cur+1} / ${QS.length}`;

  const btnBack = document.getElementById('btnBack');
  const btnNext = document.getElementById('btnNext');

  btnBack.disabled = cur === 0 && !onResults;

  let answered = false;
  if (q.type === 'grade')  answered = ans.grade !== undefined;
  if (q.type === 'single') answered = !!ans[q.id];
  if (q.type === 'multi')  answered = true; // optional

  btnNext.disabled = !answered && !onResults;
  btnNext.textContent = (cur === QS.length - 1 && !onResults) ? 'See results' : 'Continue';
  if (onResults) btnNext.disabled = true;
}

// ═══════════════════════════════════════════════════════════════════════════
// SCORING
// ═══════════════════════════════════════════════════════════════════════════

function score() {
  const grade   = ans.grade   || 6;
  const domain  = ans.domain  || '';
  const pace    = ans.pace    || '';
  const audience= ans.audience|| '';
  const prep    = ans.prep    || '';
  const enjoy   = ans.enjoy   || [];
  const compete = ans.compete || '';

  return EVENTS.map(ev => {
    if (!ev.grades.includes(grade)) return { ...ev, pts: 0, reasons: [] };
    let pts = 8;
    const reasons = [];

    // Domain → event affinity
    const domainMap = {
      math:    ['calc','math','numsense','chess'],
      words:   ['spelling','oral','oratory','imprompt'],
      science: ['science'],
      speaking:['imprompt','oratory','oral'],
      history: ['social'],
      strategy:['chess','math','numsense'],
    };
    if (domainMap[domain]?.includes(ev.id)) { pts += 30; reasons.push('aligns with your strongest domain'); }

    // Pace
    const paceMap = { fast:['calc','numsense'], steady:['math','science','social','spelling','chess'], creative:['imprompt','oratory','oral'] };
    if (paceMap[pace]?.includes(ev.id)) { pts += 14; reasons.push('matches your working pace'); }

    // Audience comfort
    const speech = ['imprompt','oratory','oral'];
    if (audience==='yes'   &&  speech.includes(ev.id)) { pts += 20; reasons.push('suits your comfort on stage'); }
    if (audience==='no'    &&  speech.includes(ev.id)) { pts -= 22; }
    if (audience==='no'    && !speech.includes(ev.id)) { pts +=  6; reasons.push('no live performance required'); }
    if (audience==='neutral'&&  speech.includes(ev.id)) { pts +=  6; }

    // Prep style
    const prepMap = {
      memorize:['spelling','social','science','chess'],
      drill:   ['calc','numsense','math'],
      write:   ['oratory','imprompt'],
      think:   ['math','chess','imprompt'],
    };
    if (prepMap[prep]?.includes(ev.id)) { pts += 12; reasons.push('fits how you prepare'); }

    // Enjoyed subjects
    const classMap = {
      math:   ['calc','math','numsense'],
      english:['spelling','oral','imprompt','oratory'],
      science:['science'],
      ss:     ['social'],
      speech: ['imprompt','oratory','oral'],
      cs:     ['calc','numsense','chess'],
    };
    for (const c of enjoy) {
      if (classMap[c]?.includes(ev.id)) { pts += 10; reasons.push(`you enjoy ${({math:'Math',english:'English',science:'Science',ss:'Social Studies',speech:'Speech/Theatre',cs:'Technology'})[c]}`); break; }
    }

    // Competition format
    const compMap = {
      test:  ['math','science','social','spelling'],
      stage: ['imprompt','oratory','oral'],
      timed: ['calc','numsense'],
      puzzle:['chess','math'],
    };
    if (compMap[compete]?.includes(ev.id)) { pts += 18; reasons.push('matches your ideal competition format'); }

    return { ...ev, pts: Math.max(0, pts), reasons: [...new Set(reasons)].slice(0,2) };
  });
}

function showResults() {
  QS.forEach((_,i) => document.getElementById(`qb${i}`).classList.remove('q-active'));
  onResults = true;

  const scored = score().filter(e => e.pts > 0).sort((a,b) => b.pts-a.pts);
  const maxPts = scored[0]?.pts || 1;
  const top = scored.slice(0,5);

  document.getElementById('rList').innerHTML = top.map((ev, i) => `
    <div class="r-row">
      <span class="r-rank">#${i+1}</span>
      <div class="r-info">
        <span class="r-name">${ev.name}</span>
        <span class="r-why">${ev.reasons.length ? ev.reasons.join(' · ') : ev.desc}</span>
      </div>
      <div class="r-bar-wrap">
        <div class="r-bar-bg"><div class="r-bar-fill" style="width:${Math.round(ev.pts/maxPts*100)}%"></div></div>
        <span class="r-score">Match ${Math.round(ev.pts/maxPts*100)}%</span>
      </div>
    </div>`
  ).join('');

  document.getElementById('resultsBlock').classList.add('r-active');

  // Grow each match bar from zero — the payoff moment for the whole flow.
  const bars = document.querySelectorAll('.r-bar-fill');
  const targets = top.map(ev => Math.round(ev.pts/maxPts*100));
  bars.forEach(b => b.style.width = '0%');
  if (window.gsap) {
    bars.forEach((b, i) => {
      gsap.to(b, { width: targets[i] + '%', duration: 0.7, ease: 'power3.out', delay: 0.35 + i * 0.08 });
    });
  } else {
    bars.forEach((b, i) => b.style.width = targets[i] + '%');
  }

  QS.forEach((_,i) => {
    const el = document.getElementById(`sbStep${i}`);
    el.classList.remove('s-active'); el.classList.add('s-done');
  });

  document.getElementById('progressFill').style.width = '100%';
  document.getElementById('topStepLabel').textContent = 'Results';
  document.getElementById('topStepCount').textContent = '';
  document.getElementById('btnNext').disabled = true;
  document.getElementById('btnBack').disabled = false;
}

function retake() {
  Object.keys(ans).forEach(k => delete ans[k]);
  cur = 0; onResults = false;
  document.getElementById('resultsBlock').classList.remove('r-active');
  document.querySelectorAll('.grade-pill').forEach(b => b.classList.remove('g-selected'));
  document.querySelectorAll('.opt-item').forEach(c => c.classList.remove('o-selected'));
  QS.forEach((_,i) => {
    const el = document.getElementById(`sbStep${i}`);
    el.classList.remove('s-active','s-done');
    document.getElementById(`qb${i}`).classList.remove('q-active');
  });
  showQ(0);
  document.getElementById('qb0').classList.add('q-active');
  refreshNav();
}

// ═══════════════════════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════════════════════
buildSidebar();
buildContent();
showQ(0);
refreshNav();
</script>
